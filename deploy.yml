---
# deploy.yml
# Vérifie que les conteneurs Terraform sont bien en vie après terraform apply

- name: "Vérification du déploiement Docker"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    image_name: "loueysioua/mon-app-devops"
    image_tag:  "latest"
    app_port:   8081

  tasks:

    - name: "Vérification que le conteneur Redis tourne"
      command: docker inspect -f '{{ "{{.State.Running}}" }}' tf-db-service
      register: redis_status
      failed_when: redis_status.stdout != "true"

    - name: "Vérification que le conteneur Web tourne"
      command: docker inspect -f '{{ "{{.State.Running}}" }}' tf-web
      register: web_status
      failed_when: web_status.stdout != "true"

    - name: "Health check HTTP sur /health"
      uri:
        url: "http://localhost:{{ app_port }}/health"
        method: GET
        status_code: 200
        timeout: 10
      retries: 5
      delay: 3

    - name: "Résumé du déploiement"
      debug:
        msg: >
          ✅ Déploiement OK —
          Redis: {{ redis_status.stdout }},
          Web: {{ web_status.stdout }},
          URL: http://localhost:{{ app_port }}
