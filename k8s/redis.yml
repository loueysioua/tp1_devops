---
# k8s/redis.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-service
  namespace: "{{ k8s_namespace }}"
  labels:
    app: db-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-service
  template:
    metadata:
      labels:
        app: db-service
    spec:
      containers:
        - name: redis
          image: redis:alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: "{{ k8s_namespace }}"
  labels:
    app: db-service
spec:
  selector:
    app: db-service
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP
